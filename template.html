<style>
/* 시험장 컴퓨터 화면처럼 한 가지 밝은 화면으로 고정한다 */

[hidden] { display: none !important; }
html, body { background: var(--bg); color: var(--ink); }
body { margin: 0; font: 15px/1.6 var(--font); word-break: keep-all; overflow-wrap: anywhere; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--sel-line); outline-offset: 2px; }
code { font: .9em ui-monospace, Consolas, "Courier New", monospace; background: var(--panel); border: 1px solid #E1E5EA; padding: 0 .3em; border-radius: 2px; }

/* 상단 바 */
.topbar { background: var(--bar); color: var(--bar-ink); display: flex; flex-wrap: wrap; align-items: center; gap: 6px 18px; padding: 8px 16px; }
.topbar .name { font-weight: 700; font-size: 14.5px; margin-right: auto; }
.topbar .meta { font-size: 13.5px; font-variant-numeric: tabular-nums; }

.topbar button { background: transparent; border: 1px solid rgba(255,255,255,.5); color: var(--bar-ink); padding: 3px 10px; border-radius: 2px; font-size: 13px; cursor: pointer; }
.subbar { background: var(--panel); border-bottom: 1px solid var(--line); display: flex; flex-wrap: wrap; align-items: center; gap: 6px 16px; padding: 7px 16px; font-size: 13.5px; }

main { padding-inline: 16px; padding-block: 20px 110px; }

/* 문항 */

.stem-ko { color: var(--muted); font-size: 14.5px; margin: 8px 0 0; padding: 8px 12px; background: var(--panel); border-left: 3px solid var(--line); }

.opts { margin: 18px 0 0; display: grid; gap: 6px; border: 0; padding: 0; }
.opts legend { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.opt { display: grid; grid-template-columns: 20px 22px 1fr; gap: 8px; align-items: start; padding: 9px 12px; border: 1px solid transparent; cursor: pointer; }
.opt:hover { background: #F5F8FC; }
.opt input { margin: 4px 0 0; width: 16px; height: 16px; accent-color: var(--sel-line); cursor: pointer; }
.opt .let { font-weight: 700; }
.opt .ko { display: block; color: var(--muted); font-size: 14px; margin-top: 2px; }
.opt .why { display: block; font-size: 13.5px; margin-top: 4px; color: var(--muted); }
.opt .why::before { content: "해설 · "; font-weight: 700; }
.opt.checked { background: var(--sel); border-color: var(--sel-line); }
.opt.right { background: var(--ok-bg); border-color: var(--ok); }
.opt.right .why { color: var(--ok); }
.opt.wrong { background: var(--no-bg); border-color: var(--no); }
.opt.wrong .why { color: var(--no); }
.opt.locked { cursor: default; }
.wbtn { border: 0; background: none; padding: 0; cursor: pointer; font: inherit; color: inherit; text-decoration: underline dotted var(--sel-line) 1.5px; text-underline-offset: 3px; }
mark.clue { background: var(--mark); color: inherit; padding: 0 1px; }

.check-row { margin-top: 16px; display: flex; flex-wrap: wrap; gap: 8px; }
.result { margin-top: 20px; border: 1px solid var(--line); }
.result h3 { margin: 0; padding: 8px 14px; font-size: 14.5px; background: var(--panel); border-bottom: 1px solid var(--line); }
.result h3.ok { color: var(--ok); }
.result h3.no { color: var(--no); }
.result .body { padding: 12px 14px; display: grid; gap: 12px; }
.result .point { font-weight: 700; margin: 0; }
.result ul { margin: 0; padding-left: 20px; display: grid; gap: 4px; }
.result h4 { margin: 0; font-size: 13px; color: var(--muted); }
.clues { margin: 0; display: grid; gap: 4px; }
.clues div { display: flex; flex-wrap: wrap; gap: 0 8px; font-size: 14px; }
.clues dt mark { background: var(--mark); }
.clues dd { margin: 0; color: var(--muted); }
.note { margin: 0; font-size: 13.5px; color: var(--flag); }
.discuss textarea { width: 100%; resize: vertical; font-size: 13.5px; padding: 6px 8px; border: 1px solid var(--line); color: var(--muted); }
.discuss p { margin: 0 0 6px; }
.wlist-inline { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 14px; }
.wlist-inline span { color: var(--muted); }

/* 하단 바 */
.bottombar { position: fixed; left: 0; right: 0; bottom: 0; background: var(--panel); border-top: 1px solid var(--line); padding: 8px 16px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; z-index: 10; }
.bottombar .mid { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.btn { border: 1px solid #9AA3AF; background: linear-gradient(#FFFFFF, #E9ECF0); padding: 6px 14px; border-radius: 2px; cursor: pointer; font-size: 14px; white-space: nowrap; }
.btn:hover { border-color: var(--sel-line); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.primary { background: var(--bar); border-color: var(--bar); color: #FFFFFF; }
.btn.flag[aria-pressed="true"] { border-color: var(--flag); color: var(--flag); font-weight: 700; }

/* 표 */
h1.title { font-size: 22px; margin: 0 0 4px; }
h2 { font-size: 16px; margin: 26px 0 8px; }
.lead { color: var(--muted); margin: 0 0 14px; }
.tbl-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { border: 1px solid var(--line); padding: 6px 10px; text-align: left; vertical-align: top; }
th { background: var(--panel); font-weight: 700; white-space: nowrap; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.modes { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; }
.mode { border: 1px solid var(--line); padding: 14px; display: grid; gap: 10px; align-content: start; }
.mode h3 { margin: 0; font-size: 15.5px; }
.mode p { margin: 0; color: var(--muted); font-size: 14px; }
.mode .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
select { border: 1px solid #9AA3AF; padding: 5px 8px; background: #FFFFFF; border-radius: 2px; }
.pass-ok { color: var(--ok); font-weight: 700; }
.pass-no { color: var(--no); font-weight: 700; }

/* 검토 화면 */
.review { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 0; border-top: 1px solid var(--line); border-left: 1px solid var(--line); }
.review button { border: 0; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); background: #FFFFFF; text-align: left; padding: 7px 10px; cursor: pointer; font-size: 13.5px; display: flex; justify-content: space-between; gap: 6px; }
.review button:hover { background: #F5F8FC; }
.review .st { color: var(--muted); }
.review .st.unans { color: var(--no); font-weight: 700; }
.review .st.flagged { color: var(--flag); font-weight: 700; }
.review .st.ok { color: var(--ok); }

/* 단어장 */
.vtools { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; margin-bottom: 12px; font-size: 14px; }
.vtools .count { margin-right: auto; color: var(--muted); font-variant-numeric: tabular-nums; }
td.word { font-weight: 700; white-space: nowrap; }
td.word small { font-weight: 400; color: var(--muted); margin-left: 4px; }
td .ex { color: var(--muted); font-size: 13px; }
td .ex mark { background: var(--mark); color: var(--ink); }
td .ex button { border: 0; background: none; padding: 0; color: var(--sel-line); cursor: pointer; font-size: 12.5px; margin-right: 6px; text-decoration: underline; }
.flash { border: 1px solid var(--line); padding: 28px 18px; text-align: center; display: grid; gap: 10px; justify-items: center; max-width: 560px; margin: 0 auto; }
.flash .fw { font-size: clamp(28px, 7vw, 40px); font-weight: 700; }
.flash .fp { color: var(--muted); font-size: 13px; }
.flash .fk { font-size: 19px; font-weight: 700; }
.flash .ex { text-align: left; color: var(--muted); font-size: 14px; }
.flash .ex mark { background: var(--mark); color: var(--ink); }

.pop { position: fixed; left: 50%; bottom: 70px; transform: translateX(-50%); width: min(420px, calc(100% - 32px)); background: #FFFFFF; border: 1px solid var(--ink); box-shadow: 0 6px 20px rgba(0,0,0,.18); padding: 12px 14px; display: grid; gap: 6px; z-index: 20; font-size: 14.5px; }
.pop .pw { font-size: 18px; font-weight: 700; }
.pop .pw small { font-size: 12.5px; font-weight: 400; color: var(--muted); margin-left: 6px; }
.pop .row { display: flex; gap: 8px; justify-content: flex-end; }
.toast { position: fixed; left: 50%; top: 12px; transform: translateX(-50%); background: var(--ink); color: #FFFFFF; padding: 7px 14px; font-size: 13.5px; z-index: 30; }
.src { font-size: 12px; color: var(--muted); margin-top: 32px; }
.src a { color: inherit; }
</style>

<header class="topbar">
  <span class="name">Claude Certified Architect – Foundations 연습</span>
  <span class="meta" id="meta"></span>
  <span class="timer" id="timer" hidden></span>
  <button id="home-btn" data-home>처음 화면</button>
</header>
<div class="subbar" id="subbar" hidden></div>
<main><div class="page" id="app"></div></main>
<div class="bottombar" id="bottombar" hidden></div>
<div id="pop" class="pop" hidden></div>
<div id="toast" class="toast" hidden></div>

<script>
const DATA = /*__DATA__*/null;
const L = ["A", "B", "C", "D"];
const LS = "ccaf-cbt-v1";
const PASS = 0.72;
const SEC_PER_Q = 120;
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = s => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
const cards = DATA.cards;
const byId = Object.fromEntries(cards.map(c => [c.id, c]));
const wordMap = Object.fromEntries(DATA.words.map(w => [w.word, w]));
const dom = id => DATA.domains.find(d => d.id === id);

// state: 기기 간 저장(db) / ui: 이 브라우저의 화면 상태
let state = { answers: {}, words: {}, tries: {}, exams: [] };
let ui = { screen: "home", ko: false, wordsOn: true, filter: "todo", domain: "all", vmode: "list", vfilter: "all", vsort: "freq", fi: 0, flip: false, session: null };
try { Object.assign(state, JSON.parse(localStorage.getItem(LS)) || {}); } catch (e) {}
try { Object.assign(ui, JSON.parse(localStorage.getItem(LS + "-ui")) || {}, { flip: false }); } catch (e) {}
let dbRef = null;

function saveLocal() {
  try { localStorage.setItem(LS, JSON.stringify(state)); localStorage.setItem(LS + "-ui", JSON.stringify(ui)); } catch (e) {}
}
function persist(patch) {
  saveLocal();
  if (dbRef) dbRef.update(patch).catch(() => toast("저장 연결이 끊겨 이 브라우저에만 저장했어요"));
}

function stemRe(word) {
  const w = word.trim();
  const q = x => x.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  if (w.includes(" ")) return new RegExp("\\b" + w.split(/\s+/).map(q).join("\\s+") + "\\b", "i");
  let s = q(w);
  if (w.length > 4) s = (w.endsWith("e") ? s.slice(0, -1) : s) + "\\w{0,4}";
  return new RegExp("\\b" + s + "\\b", "i");
}

// 지문에 단어 버튼과(채점 뒤) 단서 형광펜을 입힌다
function rich(text, words, clues) {
  const ranges = [];
  (clues || []).forEach(c => { const i = text.indexOf(c.en); if (i >= 0) ranges.push({ s: i, e: i + c.en.length, t: "clue" }); });
  const clueR = ranges.slice();
  (ui.wordsOn ? words || [] : []).forEach(w => {
    const m = stemRe(w.word).exec(text);
    if (!m) return;
    const r = { s: m.index, e: m.index + m[0].length, t: "word", w: w.word.toLowerCase() };
    const bad = ranges.some(x => x.t === "word" ? (r.s < x.e && x.s < r.e) : (r.s < x.e && x.s < r.e && !(r.s >= x.s && r.e <= x.e)));
    if (!bad) ranges.push(r);
  });
  const inner = (s, e) => {
    let out = "", p = s;
    ranges.filter(r => r.t === "word" && r.s >= s && r.e <= e).sort((a, b) => a.s - b.s).forEach(r => {
      out += fmt(text.slice(p, r.s)) + `<button class="wbtn" data-word="${esc(r.w)}">${esc(text.slice(r.s, r.e))}</button>`;
      p = r.e;
    });
    return out + fmt(text.slice(p, e));
  };
  let out = "", p = 0;
  clueR.sort((a, b) => a.s - b.s).forEach(r => {
    if (r.s < p) return;
    out += inner(p, r.s) + `<mark class="clue">${inner(r.s, r.e)}</mark>`;
    p = r.e;
  });
  return out + inner(p, text.length);
}

function domainStats(ids, getPick) {
  return DATA.domains.map(d => {
    const cs = ids.map(id => byId[id]).filter(c => c.domain === d.id);
    const done = cs.filter(c => getPick(c) != null);
    const ok = done.filter(c => getPick(c) === c.answer).length;
    return { d, total: cs.length, done: done.length, ok };
  });
}
function weighted(per) {
  const has = per.filter(x => x.done);
  const w = has.reduce((a, x) => a + x.d.weight, 0);
  return w ? has.reduce((a, x) => a + x.d.weight * x.ok / x.done, 0) / w : null;
}
// 실제 시험처럼 100~1000 척도로 환산(영역 비중 가중)
const scaled = r => Math.round(100 + 900 * r);

/* ---------- 처음 화면 ---------- */
function renderHome() {
  const per = domainStats(cards.map(c => c.id), c => state.answers[c.id]?.pick);
  const w = weighted(per);
  const done = per.reduce((a, x) => a + x.done, 0), ok = per.reduce((a, x) => a + x.ok, 0);
  const wrong = cards.filter(c => state.answers[c.id] && !state.answers[c.id].ok).length;
  const s = ui.session;
  $("#app").innerHTML = `
    <h1 class="title">CCAF 연습 시험</h1>
    <p class="lead">문제 ${cards.length}개 · 풀어 본 문제 ${done}개 · 맞힌 문제 ${ok}개 · 틀린 문제 ${wrong}개${w != null ? ` · 환산 점수 <b>${scaled(w)}</b> / 1000 (합격 720)` : ""}</p>
    ${s && !s.submitted ? `<p><button class="btn primary" data-resume>이어서 풀기 — ${s.mode === "exam" ? "모의고사" : "연습"} ${s.i + 1}번 문항</button></p>` : ""}
    <div class="modes">
      <section class="mode">
        <h3>연습 모드</h3>
        <p>한 문항씩 풀고 바로 채점해요. 정답·풀이·보기별 이유·토론 거리가 같은 화면 아래에 나와요.</p>
        <div class="row">
          <label for="f-filter">문제</label>
          <select id="f-filter">${[["todo", "안 푼 문제"], ["wrong", "틀린 문제"], ["all", "전체"], ["doubt", "정답 확인 필요"]].map(([k, l]) => `<option value="${k}" ${ui.filter === k ? "selected" : ""}>${l}</option>`).join("")}</select>
          <label for="f-domain">영역</label>
          <select id="f-domain"><option value="all">전체</option>${DATA.domains.map(d => `<option value="${d.id}" ${String(ui.domain) === String(d.id) ? "selected" : ""}>D${d.id} ${esc(d.ko)}</option>`).join("")}</select>
        </div>
        <div class="row"><button class="btn primary" data-start="practice">연습 시작</button></div>
      </section>
      <section class="mode">
        <h3>모의고사</h3>
        <p>${cards.length}문항을 섞어 문항당 2분(${Math.round(cards.length * SEC_PER_Q / 60)}분)으로 풀어요. 끝날 때까지 정답을 보여 주지 않고, 검토 표시와 검토 화면을 쓸 수 있어요.</p>
        <div class="row"><button class="btn primary" data-start="exam">모의고사 시작</button></div>
      </section>
      <section class="mode">
        <h3>단어장</h3>
        <p>지문과 보기에서 뽑은 시험 영어 ${DATA.words.length}개. 외운 단어 ${DATA.words.filter(x => state.words[x.word] === "known").length}개.</p>
        <div class="row"><button class="btn" data-screen="words">단어장 열기</button></div>
      </section>
    </div>

    <h2>영역별 정답률</h2>
    <div class="tbl-wrap"><table>
      <thead><tr><th>영역</th><th class="num">시험 비중</th><th class="num">푼 문제</th><th class="num">정답률</th></tr></thead>
      <tbody>${per.map(x => `<tr><td>D${x.d.id} ${esc(x.d.ko)}</td><td class="num">${x.d.weight}%</td><td class="num">${x.done} / ${x.total}</td><td class="num">${x.done ? `<span class="${x.ok / x.done >= PASS ? "pass-ok" : "pass-no"}">${Math.round(x.ok / x.done * 100)}%</span>` : "—"}</td></tr>`).join("")}</tbody>
    </table></div>

    ${state.exams.length ? `
    <h2>모의고사 기록</h2>
    <div class="tbl-wrap"><table>
      <thead><tr><th>날짜</th><th class="num">맞힌 문제</th><th class="num">환산 점수</th><th>결과</th><th class="num">걸린 시간</th></tr></thead>
      <tbody>${state.exams.slice().reverse().map(x => `<tr><td>${esc(x.at.slice(0, 16).replace("T", " "))}</td><td class="num">${x.ok} / ${x.total}</td><td class="num">${x.score}</td><td>${x.score >= 720 ? `<span class="pass-ok">합격선 넘음</span>` : `<span class="pass-no">합격선 미달</span>`}</td><td class="num">${Math.round(x.secs / 60)}분</td></tr>`).join("")}</tbody>
    </table></div>` : ""}

    <p class="src">문제 원문: <a href="${DATA.source.url}" target="_blank" rel="noopener">${DATA.source.name}</a> (${DATA.source.license}, 커뮤니티 연습 문제 · 실제 시험 문항 아님). 한국어 해석·풀이·단어장은 Claude 가 만들었어요. <b>정답 확인 필요</b> 표시는 공식 문서와 어긋나 보이는 문제예요.</p>`;
}

function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

function start(mode) {
  let ids;
  if (mode === "exam") ids = shuffle(cards.map(c => c.id));
  else {
    ids = cards.filter(c => ui.domain === "all" || String(c.domain) === String(ui.domain)).filter(c => {
      const a = state.answers[c.id];
      if (ui.filter === "todo") return !a;
      if (ui.filter === "wrong") return a && !a.ok;
      if (ui.filter === "doubt") return c.check === "doubt";
      return true;
    }).map(c => c.id);
    if (!ids.length) return toast(ui.filter === "todo" ? "안 푼 문제가 없어요. 문제를 '전체'나 '틀린 문제'로 바꿔 보세요." : "조건에 맞는 문제가 없어요.");
  }
  ui.session = { mode, ids, i: 0, picks: {}, marks: {}, checked: {}, startedAt: Date.now(), endsAt: mode === "exam" ? Date.now() + ids.length * SEC_PER_Q * 1000 : null, submitted: false };
  ui.screen = "q";
  saveLocal(); render(); window.scrollTo(0, 0);
}

/* ---------- 문항 화면 ---------- */
function renderQuestion() {
  const s = ui.session, c = byId[s.ids[s.i]];
  const pick = s.picks[c.id];
  const reveal = s.mode === "practice" ? !!s.checked[c.id] : s.submitted;
  const d = dom(c.domain);
  $("#subbar").innerHTML = `
    <span class="where"><b>문항 ${s.i + 1} / ${s.ids.length}</b> · ${c.id} · D${d.id} ${esc(d.ko)} · 시나리오: ${esc(c.scenario)}</span>
    <label><input type="checkbox" id="t-ko" ${ui.ko ? "checked" : ""}> 한국어 해석</label>
    <label><input type="checkbox" id="t-words" ${ui.wordsOn ? "checked" : ""}> 단어 뜻</label>`;

  const opts = c.options.map((o, i) => {
    let cls = "opt";
    if (reveal) { cls += " locked"; if (i === c.answer) cls += " right"; else if (i === pick) cls += " wrong"; }
    else if (i === pick) cls += " checked";
    return `<label class="${cls}">
      <input type="radio" name="opt" value="${i}" ${i === pick ? "checked" : ""} ${reveal ? "disabled" : ""}>
      <span class="let">${L[i]}.</span>
      <span>${rich(o.en, c.words)}${ui.ko ? `<span class="ko">${esc(o.ko)}</span>` : ""}${reveal ? `<span class="why">${fmt(o.why)}</span>` : ""}</span>
    </label>`;
  }).join("");

  const ok = pick === c.answer;
  const discussText = `CCAF ${c.id} 토론하자 — ${c.discuss_ko} (내 답 ${pick != null ? L[pick] : "없음"}, 정답 ${L[c.answer]})`;
  const result = reveal ? `
    <section class="result" aria-live="polite">
      <h3 class="${ok ? "ok" : "no"}">${pick == null ? "답하지 않음" : ok ? "정답" : "오답"} — 정답 ${L[c.answer]}${pick != null ? ` · 내 답 ${L[pick]}` : ""}</h3>
      <div class="body">
        <p class="point">${fmt(c.point_ko)}</p>
        <ul>${c.explain_ko.map(x => `<li>${fmt(x)}</li>`).join("")}</ul>
        <div><h4>지문 단서</h4><dl class="clues">${c.clues.map(x => `<div><dt><mark>${fmt(x.en)}</mark></dt><dd>${esc(x.ko)}</dd></div>`).join("")}</dl></div>
        ${c.check === "doubt" && c.checkNote ? `<p class="note"><b>정답 확인 필요:</b> ${fmt(c.checkNote)}</p>` : ""}
        <div class="discuss"><h4>토론 거리</h4><p>${esc(c.discuss_ko)}</p>
          <textarea id="discuss-text" rows="2" readonly>${esc(discussText)}</textarea>
          <button class="btn" data-copy>토론 요청 복사</button></div>
        <div><h4>이 문항의 단어</h4><div class="wlist-inline">${c.words.map(w => `<button class="wbtn" data-word="${esc(w.word.toLowerCase())}">${esc(w.word)}</button><span>${esc(w.ko)}</span>`).join("")}</div></div>
      </div>
    </section>` : "";

  $("#app").innerHTML = `
    ${c.check === "doubt" && reveal ? `<span class="doubt">정답 확인 필요</span>` : ""}
    <p class="stem">${rich(c.q_en, c.words, reveal ? c.clues : null)}</p>
    ${ui.ko ? `<p class="stem-ko">${fmt(c.q_ko)}</p>` : ""}
    <fieldset class="opts"><legend>보기</legend>${opts}</fieldset>
    ${s.mode === "practice" ? `<div class="check-row">${reveal
      ? `<button class="btn" data-retry>다시 풀기</button>`
      : `<button class="btn primary" data-check ${pick == null ? "disabled" : ""}>정답 확인</button>`}</div>` : ""}
    ${result}`;

  const last = s.i === s.ids.length - 1;
  $("#bottombar").innerHTML = `
    <button class="btn" data-move="-1" ${s.i === 0 ? "disabled" : ""}>◀ 이전</button>
    <span class="mid">
      ${s.mode === "exam" && !s.submitted ? `<button class="btn flag" data-flag aria-pressed="${!!s.marks[c.id]}">${s.marks[c.id] ? "검토 표시됨" : "검토 표시"}</button>` : ""}
      <button class="btn" data-screen="review">검토 화면</button>
    </span>
    ${last ? (s.mode === "exam" && !s.submitted ? `<button class="btn primary" data-screen="review">검토 후 종료</button>` : `<button class="btn primary" data-screen="${s.mode === "exam" ? "result" : "review"}">끝</button>`) : `<button class="btn primary" data-move="1">다음 ▶</button>`}`;
}

/* ---------- 검토 화면 ---------- */
function renderReview() {
  const s = ui.session;
  const unans = s.ids.filter(id => s.picks[id] == null).length;
  const flagged = s.ids.filter(id => s.marks[id]).length;
  $("#subbar").innerHTML = `<span class="where"><b>검토 화면</b> · 답한 문항 ${s.ids.length - unans} · 답하지 않은 문항 ${unans}${s.mode === "exam" ? ` · 검토 표시 ${flagged}` : ""}</span>`;
  $("#app").innerHTML = `
    <p class="lead">문항을 누르면 그 문항으로 가요.</p>
    <div class="review">${s.ids.map((id, i) => {
      const p = s.picks[id];
      let st, cls;
      if (s.mode === "practice" && s.checked[id]) { st = p === byId[id].answer ? "정답" : "오답"; cls = p === byId[id].answer ? "ok" : "unans"; }
      else if (s.marks[id]) { st = "검토 표시"; cls = "flagged"; }
      else if (p == null) { st = "미답"; cls = "unans"; }
      else { st = "답함 " + L[p]; cls = ""; }
      return `<button data-jump="${i}"><span>${i + 1}. ${id}</span><span class="st ${cls}">${st}</span></button>`;
    }).join("")}</div>`;
  $("#bottombar").innerHTML = `
    <button class="btn" data-screen="q">◀ 문항으로 돌아가기</button>
    <span class="mid">${s.mode === "exam" && !s.submitted ? `<button class="btn" data-jumpflag ${flagged ? "" : "disabled"}>검토 표시 문항만 보기</button>` : ""}</span>
    ${s.mode === "exam" ? (s.submitted ? `<button class="btn primary" data-screen="result">성적표</button>` : `<button class="btn primary" data-submit>시험 종료</button>`) : `<button class="btn primary" data-home>연습 끝내기</button>`}`;
}

/* ---------- 성적표 ---------- */
function renderResult() {
  const s = ui.session;
  const per = domainStats(s.ids, c => s.picks[c.id]);
  const ok = s.ids.filter(id => s.picks[id] === byId[id].answer).length;
  const r = weighted(DATA.domains.map((d, k) => ({ ...per[k], done: per[k].total }))) || 0;
  const score = scaled(r);
  $("#subbar").innerHTML = `<span class="where"><b>성적표</b> · 모의고사</span>`;
  $("#app").innerHTML = `
    <h1 class="title">환산 점수 ${score} / 1000</h1>
    <p class="lead">${score >= 720 ? `<span class="pass-ok">합격선 720을 넘었어요.</span>` : `<span class="pass-no">합격선 720에 ${720 - score}점 모자라요.</span>`} 맞힌 문제 ${ok} / ${s.ids.length} · 영역 비중으로 가중한 점수예요.</p>
    <div class="tbl-wrap"><table>
      <thead><tr><th>영역</th><th class="num">비중</th><th class="num">맞힘</th><th class="num">정답률</th></tr></thead>
      <tbody>${per.map(x => `<tr><td>D${x.d.id} ${esc(x.d.ko)}</td><td class="num">${x.d.weight}%</td><td class="num">${x.ok} / ${x.total}</td><td class="num"><span class="${x.total && x.ok / x.total >= PASS ? "pass-ok" : "pass-no"}">${x.total ? Math.round(x.ok / x.total * 100) : 0}%</span></td></tr>`).join("")}</tbody>
    </table></div>
    <h2>틀린 문항</h2>
    <div class="review">${s.ids.map((id, i) => [id, i]).filter(([id]) => s.picks[id] !== byId[id].answer).map(([id, i]) => `<button data-jump="${i}"><span>${i + 1}. ${id}</span><span class="st unans">${s.picks[id] == null ? "미답" : L[s.picks[id]] + " → " + L[byId[id].answer]}</span></button>`).join("") || `<p class="lead">없어요.</p>`}</div>`;
  $("#bottombar").innerHTML = `<button class="btn" data-screen="review">전체 문항 풀이</button><span class="mid"></span><button class="btn primary" data-home>처음 화면</button>`;
}

function submitExam() {
  const s = ui.session;
  s.submitted = true;
  const patchAns = {}, patchTries = {};
  s.ids.forEach(id => {
    if (s.picks[id] == null) return;
    const n = (state.tries[id] || 0) + 1;
    state.tries[id] = n; patchTries[id] = n;
    state.answers[id] = patchAns[id] = { pick: s.picks[id], ok: s.picks[id] === byId[id].answer, at: new Date().toISOString(), n };
  });
  const per = domainStats(s.ids, c => s.picks[c.id]);
  const r = weighted(per.map(x => ({ ...x, done: x.total }))) || 0;
  state.exams.push({ at: new Date().toISOString(), ok: s.ids.filter(id => s.picks[id] === byId[id].answer).length, total: s.ids.length, score: scaled(r), secs: Math.round((Date.now() - s.startedAt) / 1000) });
  persist({ answers: patchAns, tries: patchTries, exams: state.exams });
  ui.screen = "result"; render(); window.scrollTo(0, 0);
}

/* ---------- 단어장 ---------- */
function wordList() {
  let ws = DATA.words.slice();
  if (ui.vfilter === "learn") ws = ws.filter(w => state.words[w.word] !== "known");
  if (ui.vfilter === "known") ws = ws.filter(w => state.words[w.word] === "known");
  if (ui.vsort === "abc") ws.sort((a, b) => a.word.localeCompare(b.word));
  return ws;
}
function exHtml(w, links) {
  return w.examples.slice(0, 2).map(ex => {
    const t = ex.text.replace(/`/g, "");
    const mm = stemRe(w.word).exec(t);
    const body = mm ? esc(t.slice(0, mm.index)) + "<mark>" + esc(mm[0]) + "</mark>" + esc(t.slice(mm.index + mm[0].length)) : esc(t);
    return `<div class="ex">${links ? `<button data-card="${ex.id}">${ex.id}</button>` : ""}${body}</div>`;
  }).join("");
}
function renderWords() {
  const all = DATA.words.length, known = DATA.words.filter(w => state.words[w.word] === "known").length;
  const ws = wordList();
  $("#subbar").innerHTML = `<span class="where"><b>단어장</b> · 전체 ${all} · 외운 단어 ${known} · 남은 단어 ${all - known}</span>`;
  const tools = `
    <div class="vtools">
      <span class="count">${ws.length}개 표시</span>
      <label>보기 <select id="v-mode"><option value="list" ${ui.vmode === "list" ? "selected" : ""}>표</option><option value="flash" ${ui.vmode === "flash" ? "selected" : ""}>암기 카드</option></select></label>
      <label>거르기 <select id="v-filter">${[["all", "전체"], ["learn", "외울 것"], ["known", "외운 것"]].map(([k, l]) => `<option value="${k}" ${ui.vfilter === k ? "selected" : ""}>${l}</option>`).join("")}</select></label>
      <label>정렬 <select id="v-sort"><option value="freq" ${ui.vsort === "freq" ? "selected" : ""}>빈출순</option><option value="abc" ${ui.vsort === "abc" ? "selected" : ""}>ABC순</option></select></label>
    </div>`;
  let body;
  if (!ws.length) body = `<p class="lead">${ui.vfilter === "known" ? "아직 외운 단어가 없어요." : "남은 단어가 없어요."}</p>`;
  else if (ui.vmode === "list") {
    body = `<div class="tbl-wrap"><table>
      <thead><tr><th>외움</th><th>단어</th><th>뜻과 예문</th><th class="num">빈출</th></tr></thead>
      <tbody>${ws.map(w => `<tr>
        <td><input type="checkbox" id="k-${esc(w.word).replace(/\s/g, "_")}" data-know="${esc(w.word)}" ${state.words[w.word] === "known" ? "checked" : ""} aria-label="${esc(w.word)} 외움"></td>
        <td class="word">${esc(w.word)}<small>${esc(w.pos)}</small></td>
        <td>${esc(w.ko)}${exHtml(w, true)}</td>
        <td class="num">${w.freq}회</td></tr>`).join("")}</tbody>
    </table></div>`;
  } else {
    ui.fi = Math.min(ui.fi, ws.length - 1);
    const w = ws[ui.fi];
    body = `<div class="flash">
      <div class="fp">${ui.fi + 1} / ${ws.length} · 지문 ${w.freq}회</div>
      <div class="fw">${esc(w.word)}</div><div class="fp">${esc(w.pos)}</div>
      ${ui.flip ? `<div class="fk">${esc(w.ko)}</div>${exHtml(w, false)}` : `<button class="btn" data-flip>뜻 보기</button>`}
    </div>`;
  }
  $("#app").innerHTML = tools + body;
  $("#bottombar").innerHTML = ui.vmode === "flash" && ws.length
    ? `<button class="btn" data-fprev>◀ 이전</button><span class="mid"><button class="btn" data-fnext="learn">아직 헷갈려요</button></span><button class="btn primary" data-fnext="known">외웠어요 ▶</button>`
    : `<span></span><span class="mid"></span><button class="btn primary" data-home>처음 화면</button>`;
}

/* ---------- 공통 ---------- */
function render() {
  const s = ui.session;
  if (["q", "review", "result"].includes(ui.screen) && !s) ui.screen = "home";
  $("#subbar").hidden = ui.screen === "home";
  $("#bottombar").hidden = ui.screen === "home";
  $("#home-btn").hidden = ui.screen === "home";
  $("#meta").textContent = s && ui.screen !== "home" && ui.screen !== "words" ? (s.mode === "exam" ? "모의고사" : "연습 모드") : "";
  $("#pop").hidden = true;
  if (ui.screen === "home") renderHome();
  else if (ui.screen === "q") renderQuestion();
  else if (ui.screen === "review") renderReview();
  else if (ui.screen === "result") renderResult();
  else renderWords();
  tick();
}

function tick() {
  const s = ui.session, t = $("#timer");
  if (!s || s.mode !== "exam" || s.submitted || ui.screen === "home" || ui.screen === "words") { t.hidden = true; return; }
  const left = Math.max(0, Math.round((s.endsAt - Date.now()) / 1000));
  t.hidden = false;
  t.textContent = `남은 시간 ${Math.floor(left / 3600)}:${String(Math.floor(left / 60) % 60).padStart(2, "0")}:${String(left % 60).padStart(2, "0")}`;
  t.classList.toggle("low", left < 600);
  if (left === 0) { toast("시간이 끝나 자동으로 제출했어요"); submitExam(); }
}
setInterval(tick, 1000);

function showWord(key) {
  const w = wordMap[key];
  if (!w) return;
  const known = state.words[key] === "known";
  const pop = $("#pop");
  pop.innerHTML = `<div class="pw">${esc(w.word)}<small>${esc(w.pos)} · 전체 지문 ${w.freq}회</small></div><div>${esc(w.ko)}</div>
    <div class="row"><button class="btn" data-know="${esc(key)}">${known ? "외울 단어로 되돌리기" : "외웠어요"}</button><button class="btn" data-close>닫기</button></div>`;
  pop.hidden = false;
}
function setKnown(key, on) {
  const next = (on ?? state.words[key] !== "known") ? "known" : "learn";
  state.words[key] = next;
  persist({ words: { [key]: next } });
}
function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.hidden = false;
  clearTimeout(toast.t); toast.t = setTimeout(() => { t.hidden = true; }, 2600);
}
function go(screen) { ui.screen = screen; saveLocal(); render(); window.scrollTo(0, 0); }

document.addEventListener("click", e => {
  const el = e.target.closest("button");
  if (!el) { if (!e.target.closest("#pop, input, label")) $("#pop").hidden = true; return; }
  const d = el.dataset, s = ui.session;
  if ("home" in d) { if (s && s.submitted) ui.session = null; return go("home"); }
  if (d.start) return start(d.start);
  if ("resume" in d) return go("q");
  if (d.screen) return go(d.screen);
  if (d.move) { s.i = Math.max(0, Math.min(s.ids.length - 1, s.i + +d.move)); return go("q"); }
  if (d.jump) { s.i = +d.jump; return go("q"); }
  if ("jumpflag" in d) { const i = s.ids.findIndex(id => s.marks[id]); if (i >= 0) { s.i = i; go("q"); } return; }
  if ("flag" in d) { const id = s.ids[s.i]; s.marks[id] = !s.marks[id]; saveLocal(); return render(); }
  if ("submit" in d) {
    const unans = s.ids.filter(id => s.picks[id] == null).length;
    if (!confirm(unans ? `답하지 않은 문항이 ${unans}개 있어요. 시험을 종료할까요?` : "시험을 종료하고 채점할까요?")) return;
    return submitExam();
  }
  if ("check" in d) {
    const id = s.ids[s.i], pick = s.picks[id];
    if (pick == null) return;
    s.checked[id] = true;
    const n = (state.tries[id] || 0) + 1;
    state.tries[id] = n;
    state.answers[id] = { pick, ok: pick === byId[id].answer, at: new Date().toISOString(), n };
    persist({ answers: { [id]: state.answers[id] }, tries: { [id]: n } });
    return render();
  }
  if ("retry" in d) { const id = s.ids[s.i]; delete s.checked[id]; delete s.picks[id]; saveLocal(); return render(); }
  if ("copy" in d) {
    const ta = $("#discuss-text");
    const fallback = () => { ta.select(); toast("글자를 선택해 두었어요. 복사해서 붙여 넣으세요"); };
    if (navigator.clipboard?.writeText) navigator.clipboard.writeText(ta.value).then(() => toast("복사했어요. Claude Code 채팅에 붙여 넣으세요"), fallback);
    else fallback();
    return;
  }
  if (d.know) { setKnown(d.know); showWord(d.know); return; }
  if ("close" in d) { $("#pop").hidden = true; return; }
  if (d.word) return showWord(d.word);
  if (d.card) { ui.session = { mode: "practice", ids: [d.card], i: 0, picks: {}, marks: {}, checked: {}, startedAt: Date.now(), endsAt: null, submitted: false }; return go("q"); }
  if ("flip" in d) { ui.flip = true; return render(); }
  if ("fprev" in d) { ui.fi = Math.max(0, ui.fi - 1); ui.flip = false; return render(); }
  if (d.fnext) {
    const ws = wordList(), w = ws[ui.fi];
    if (w) setKnown(w.word, d.fnext === "known");
    const after = wordList();
    ui.fi = after.length === ws.length ? (ui.fi + 1) % Math.max(1, after.length) : (after.length ? ui.fi % after.length : 0);
    ui.flip = false; saveLocal(); return render();
  }
});

document.addEventListener("change", e => {
  const t = e.target, s = ui.session;
  if (t.name === "opt") { s.picks[s.ids[s.i]] = +t.value; saveLocal(); return render(); }
  if (t.id === "t-ko") { ui.ko = t.checked; saveLocal(); return render(); }
  if (t.id === "t-words") { ui.wordsOn = t.checked; saveLocal(); return render(); }
  if (t.id === "f-filter") { ui.filter = t.value; return saveLocal(); }
  if (t.id === "f-domain") { ui.domain = t.value; return saveLocal(); }
  if (t.id === "v-mode") { ui.vmode = t.value; ui.fi = 0; ui.flip = false; saveLocal(); return render(); }
  if (t.id === "v-filter") { ui.vfilter = t.value; ui.fi = 0; ui.flip = false; saveLocal(); return render(); }
  if (t.id === "v-sort") { ui.vsort = t.value; saveLocal(); return render(); }
  if (t.dataset.know) { setKnown(t.dataset.know, t.checked); return render(); }
});

document.addEventListener("keydown", e => {
  if (e.target.matches("textarea, select") || ui.screen !== "q") return;
  const s = ui.session, c = byId[s.ids[s.i]];
  const locked = s.mode === "practice" ? s.checked[c.id] : s.submitted;
  if (/^[1-4]$/.test(e.key) && !locked) { s.picks[c.id] = +e.key - 1; saveLocal(); render(); }
  else if (e.key === "ArrowRight" && s.i < s.ids.length - 1) { s.i++; go("q"); }
  else if (e.key === "ArrowLeft" && s.i > 0) { s.i--; go("q"); }
  else if (e.key === "Escape") $("#pop").hidden = true;
});

render();

(async () => {
  try {
    const db = window.claude?.use ? await window.claude.use("db") : null;
    if (!db) return;
    dbRef = db.doc("progress/miji");
    const snap = await dbRef.get();
    if (snap.exists) {
      const d = snap.data();
      state = {
        answers: Object.assign({}, state.answers, d.answers),
        words: Object.assign({}, state.words, d.words),
        tries: Object.assign({}, state.tries, d.tries),
        exams: (d.exams && d.exams.length >= state.exams.length) ? d.exams : state.exams,
      };
    } else {
      await dbRef.set(state);
    }
    saveLocal();
    if ($("#pop").hidden && ui.screen !== "q") render();
  } catch (e) {}
})();
</script>
