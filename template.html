<style>
/* 시험장 컴퓨터 화면처럼 한 가지 밝은 화면으로 고정한다 */
:root {
  --bg: #FFFFFF;
  --panel: #F1F3F6;
  --bar: #1E3A5F;
  --bar-ink: #FFFFFF;
  --ink: #1A1D21;
  --muted: #5A6270;
  --line: #C6CCD5;
  --sel: #DDE8F6;
  --sel-line: #3A6EA5;
  --ok: #1F7A4D;
  --ok-bg: #E3F2EA;
  --no: #B3261E;
  --no-bg: #FBE9E7;
  --mark: #FFF0A0;
  --flag: #B86E00;
  --font: Arial, "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { background: var(--bg); color: var(--ink); }
body { margin: 0; font: 15px/1.6 var(--font); word-break: keep-all; overflow-wrap: anywhere; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--sel-line); outline-offset: 2px; }
code { font: .9em ui-monospace, Consolas, "Courier New", monospace; background: var(--panel); border: 1px solid #E1E5EA; padding: 0 .3em; border-radius: 2px; }

/* 상단 바 */
.topbar { background: var(--bar); color: var(--bar-ink); display: flex; flex-wrap: wrap; align-items: center; gap: 6px 18px; padding: 8px 16px; }
.topbar .name { font-weight: 700; font-size: 14.5px; margin-right: auto; }
.topbar .meta { font-size: 13.5px; font-variant-numeric: tabular-nums; }
.topbar .timer { font-weight: 700; font-size: 14.5px; font-variant-numeric: tabular-nums; }
.topbar .timer.low { color: #FFD166; }
.topbar button { background: transparent; border: 1px solid rgba(255,255,255,.5); color: var(--bar-ink); padding: 3px 10px; border-radius: 2px; font-size: 13px; cursor: pointer; }
.subbar { background: var(--panel); border-bottom: 1px solid var(--line); display: flex; flex-wrap: wrap; align-items: center; gap: 6px 16px; padding: 7px 16px; font-size: 13.5px; }
.subbar .where { margin-right: auto; color: var(--muted); }
.subbar .where b { color: var(--ink); }

.subbar label select { min-width: 0; max-width: 100%; }

main { padding-inline: 16px; padding-block: 20px 110px; }
.page { max-width: 920px; margin: 0 auto; }

/* 문항 */
.stem { font-size: 16px; line-height: 1.7; margin: 0 0 6px; }
.stem-ko { color: var(--muted); font-size: 14.5px; margin: 8px 0 0; padding: 8px 12px; background: var(--panel); border-left: 3px solid var(--line); }
.doubt { display: inline-block; font-size: 12.5px; color: var(--flag); border: 1px solid var(--flag); padding: 0 6px; margin-bottom: 10px; }
.opts { margin: 18px 0 0; display: grid; gap: 6px; border: 0; padding: 0; }
.opts legend { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.opt { display: grid; grid-template-columns: 20px 22px 1fr; gap: 8px; align-items: start; padding: 9px 12px; border: 1px solid transparent; cursor: pointer; }
.opt:hover { background: #F5F8FC; }
.opt input { margin: 4px 0 0; width: 16px; height: 16px; accent-color: var(--sel-line); cursor: pointer; }
.opt .let { font-weight: 700; }
.opt .ko { display: block; color: var(--muted); font-size: 14px; margin-top: 2px; }
.opt .why { display: block; font-size: 13.5px; margin-top: 4px; color: var(--muted); }
.opt .why::before { content: "해설 · "; font-weight: 700; }
.opt.checked { background: var(--sel); border-color: var(--sel-line); }
.opt.right { background: var(--ok-bg); border-color: var(--ok); }
.opt.right .why { color: var(--ok); }
.opt.wrong { background: var(--no-bg); border-color: var(--no); }
.opt.wrong .why { color: var(--no); }
.opt.locked { cursor: default; }
.wbtn { border: 0; background: none; padding: 0 1px; cursor: pointer; font: inherit; color: inherit; text-underline-offset: 3px; }
.wbtn.learn { background: #FFF1D6; text-decoration: underline solid #D98200 2px; }
.wbtn.known { text-decoration: underline dotted var(--ok) 1.5px; }
.wkey { display: inline-flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--muted); }
.wkey i { display: inline-block; width: 22px; height: 12px; vertical-align: -1px; margin-right: 3px; }
.wkey .k-learn { background: #FFF1D6; border-bottom: 2px solid #D98200; }
.wkey .k-known { border-bottom: 2px dotted var(--ok); }
.pop .st { font-size: 12.5px; font-weight: 700; }
.pop .st.learn { color: #B36B00; }
.pop .st.known { color: var(--ok); }
mark.clue { background: var(--mark); color: inherit; padding: 0 1px; }

.check-row { margin-top: 16px; display: flex; flex-wrap: wrap; gap: 8px; }
.result { margin-top: 20px; border: 1px solid var(--line); }
.result h3 { margin: 0; padding: 8px 14px; font-size: 14.5px; background: var(--panel); border-bottom: 1px solid var(--line); }

/* 하단 바 */

/* 표 */

/* 검토 화면 */
.review { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 0; border-top: 1px solid var(--line); border-left: 1px solid var(--line); }

/* 단어장 */
.vtools { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; margin-bottom: 12px; font-size: 14px; }
.vtools .count { margin-right: auto; color: var(--muted); font-variant-numeric: tabular-nums; }
td.word { font-weight: 700; white-space: nowrap; }
td.word.wrap { white-space: normal; width: 38%; min-width: 8em; }

.exko { display: block; color: #3A414C; font-size: .95em; }

.flash .frow { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 8px; }

.pop .pw { font-size: 18px; font-weight: 700; }
.pop .pw small { font-size: 12.5px; font-weight: 400; color: var(--muted); margin-left: 6px; }

.src { font-size: 12px; color: var(--muted); margin-top: 32px; }

.scbox { margin: 0 0 16px; border: 1px solid var(--line); background: var(--panel); }
.scbox summary { padding: 7px 12px; cursor: pointer; font-size: 14px; }

.memo textarea, .note-item textarea { width: 100%; resize: vertical; font-size: 14px; padding: 6px 8px; border: 1px solid #9AA3AF; }
.memo-state { font-size: 12px; color: var(--muted); }
.seg-row { display: flex; flex-wrap: wrap; gap: 6px; }
.note-item { border: 1px solid var(--line); border-left: 4px solid var(--no); padding: 10px 14px; margin-bottom: 10px; display: grid; gap: 6px; }

.note-item header { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 13.5px; color: var(--muted); }
.note-item header b { color: var(--ink); }
.note-item .nq { margin: 0; font-size: 14.5px; }
.note-item .na { margin: 0; font-size: 14px; }
.note-item .row { display: flex; flex-wrap: wrap; gap: 8px; }
.review-box { border: 1px solid var(--flag); background: #FFF8EC; padding: 10px 12px; display: grid; gap: 6px; }

/* 시나리오 공부 */
.study { display: grid; gap: 30px; }
.study section { display: grid; gap: 10px; }
.study h2 { margin: 0; font-size: 17px; padding-left: 10px; border-left: 4px solid var(--bar); }

<header class="topbar">
  <span class="name">Claude Certified Architect – Foundations 연습</span>
  <span class="meta" id="meta"></span>
  <span class="timer" id="timer" hidden></span>
  <button class="sync-pill" id="sync-pill" data-sync-now hidden></button>
  <button id="home-btn" data-home>처음 화면</button>
</header>
<div class="subbar" id="subbar" hidden></div>
<main><div class="page" id="app"></div></main>
<div class="bottombar" id="bottombar" hidden></div>

<div id="toast" class="toast" hidden></div>

<script>
const DATA = /*__DATA__*/null;
const L = ["A", "B", "C", "D", "E"];
const LS = "ccaf-cbt-v1";
const PASS = 0.72;
const EXAM_Q = 60, EXAM_MIN = 120;
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = s => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
const cards = DATA.cards;
const byId = Object.fromEntries(cards.map(c => [c.id, c]));
const wordMap = Object.fromEntries(DATA.words.map(w => [w.word, w]));
const dom = id => DATA.domains.find(d => d.id === id);
const scen = no => DATA.scenarios.find(s => s.no === no);
const guideOf = no => DATA.guide.find(g => g.no === no);
const SRC = { official: "공식 가이드 샘플", community: "커뮤니티 연습 문제", claude: "Claude 작성 · 검수 전" };

// 답은 한 개(숫자) 또는 여러 개(배열). 비교는 정렬한 배열로 한다
const arr = p => p == null ? [] : (Array.isArray(p) ? p : [p]).slice().sort((a, b) => a - b);
const isRight = (c, p) => { const a = arr(c.answer), b = arr(p); return b.length === a.length && a.every((x, i) => x === b[i]); };
const letters = p => arr(p).map(i => L[i]).join(", ");
const need = c => c.select || 1;
const complete = (c, p) => arr(p).length === need(c);

let state = { answers: {}, words: {}, wordsAt: {}, tries: {}, exams: [], wrongs: {}, notes: {}, reviews: {} };

function backfillWrongs() {
  state.wrongs = state.wrongs || {}; state.notes = state.notes || {};
  Object.entries(state.answers).forEach(([id, a]) => { if (!a.ok && !state.wrongs[id]) state.wrongs[id] = { n: 1, at: a.at, first: a.at }; });
}
backfillWrongs();
// 채점 한 건을 기록한다: 틀리면 오답노트에 쌓고, 다시 맞히면 극복 시각을 남긴다
function recordAnswer(id, pick) {
  const c = byId[id], now = new Date().toISOString();
  const n = (state.tries[id] || 0) + 1;
  state.tries[id] = n;
  const ok = isRight(c, pick);
  state.answers[id] = { pick, ok, at: now, n };
  const w = state.wrongs[id];
  if (!ok) state.wrongs[id] = { n: (w?.n || 0) + 1, at: now, first: w?.first || now };
  else if (w) state.wrongs[id] = { ...w, fixedAt: now };
  return { answers: { [id]: state.answers[id] }, tries: { [id]: n }, ...(state.wrongs[id] ? { wrongs: { [id]: state.wrongs[id] } } : {}) };
}

const wcls = w => state.words[w] === "known" ? "known" : "learn";
function stemRe(word) {
  const w = word.trim();
  const q = x => x.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  if (w.includes(" ")) return new RegExp("\\b" + w.split(/\s+/).map(q).join("\\s+") + "\\b", "i");
  let s = q(w);
  if (w.length > 4) s = (w.endsWith("e") ? s.slice(0, -1) : s) + "\\w{0,4}";
  return new RegExp("\\b" + s + "\\b", "i");
}

// 지문에 단어 버튼과(채점 뒤) 단서 형광펜을 입힌다
function rich(text, words, clues) {
  const ranges = [];
  (clues || []).forEach(c => { const i = text.indexOf(c.en); if (i >= 0) ranges.push({ s: i, e: i + c.en.length, t: "clue" }); });
  const clueR = ranges.slice();
  (ui.wordsOn ? words || [] : []).forEach(w => {
    const m = stemRe(w.word).exec(text);
    if (!m) return;
    const r = { s: m.index, e: m.index + m[0].length, t: "word", w: w.word.toLowerCase() };
    const bad = ranges.some(x => x.t === "word" ? (r.s < x.e && x.s < r.e) : (r.s < x.e && x.s < r.e && !(r.s >= x.s && r.e <= x.e)));
    if (!bad) ranges.push(r);
  });
  const inner = (s, e) => {
    let out = "", p = s;
    ranges.filter(r => r.t === "word" && r.s >= s && r.e <= e).sort((a, b) => a.s - b.s).forEach(r => {
      out += fmt(text.slice(p, r.s)) + `<button class="wbtn ${wcls(r.w)}" data-word="${esc(r.w)}">${esc(text.slice(r.s, r.e))}</button>`;
      p = r.e;
    });
    return out + fmt(text.slice(p, e));
  };
  let out = "", p = 0;
  clueR.sort((a, b) => a.s - b.s).forEach(r => {
    if (r.s < p) return;
    out += inner(p, r.s) + `<mark class="clue">${inner(r.s, r.e)}</mark>`;
    p = r.e;
  });
  return out + inner(p, text.length);
}

function groupStats(list, keyOf, keys, getPick) {
  return keys.map(k => {
    const cs = list.filter(c => keyOf(c) === k);
    const done = cs.filter(c => getPick(c) != null);
    const ok = done.filter(c => isRight(c, getPick(c))).length;
    return { k, total: cs.length, done: done.length, ok };
  });
}
function domainStats(list, getPick) {
  return groupStats(list, c => c.domain, DATA.domains.map(d => d.id), getPick).map(x => ({ ...x, d: dom(x.k) }));
}
function weighted(per) {
  const has = per.filter(x => x.done);
  const w = has.reduce((a, x) => a + x.d.weight, 0);
  return w ? has.reduce((a, x) => a + x.d.weight * x.ok / x.done, 0) / w : null;
}
// 실제 시험처럼 100~1000 척도로 환산(영역 비중 가중)
const scaled = r => Math.round(100 + 900 * r);
const rate = x => x.done ? `<span class="${x.ok / x.done >= PASS ? "pass-ok" : "pass-no"}">${Math.round(x.ok / x.done * 100)}%</span>` : "—";

function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

// 모의고사: 영역 비중대로 60문항을 뽑고, 모자란 영역은 다른 문항으로 채운다
function examIds() {
  const base = mainCards();
  const n = Math.min(EXAM_Q, base.length);
  const picked = [];
  DATA.domains.forEach(d => {
    const want = Math.round(n * d.weight / 100);
    picked.push(...shuffle(base.filter(c => c.domain === d.id)).slice(0, want).map(c => c.id));
  });
  const rest = shuffle(base.filter(c => !picked.includes(c.id))).map(c => c.id);
  while (picked.length < n && rest.length) picked.push(rest.pop());
  return shuffle(picked.slice(0, n));
}

function newSession(mode, ids) {
  return { mode, ids, i: 0, picks: {}, marks: {}, checked: {}, startedAt: Date.now(), endsAt: mode === "exam" ? Date.now() + EXAM_MIN * 60 * 1000 : null, submitted: false };
}

function start(mode) {
  let ids;
  if (mode === "exam") ids = examIds();
  else {
    ids = mainCards()
      .filter(c => ui.domain === "all" || String(c.domain) === String(ui.domain))
      .filter(c => ui.scen === "all" || String(c.sc) === String(ui.scen))
      .filter(c => {
        const a = state.answers[c.id];
        if (ui.filter === "todo") return !a;
        if (ui.filter === "wrong") return a && !a.ok;
        if (ui.filter === "doubt") return c.check === "doubt";
        if (ui.filter === "official") return c.source === "official";
        if (ui.filter === "multi") return need(c) > 1;
        return true;
      }).map(c => c.id);
    if (!ids.length) return toast(ui.filter === "todo" ? "안 푼 문제가 없어요. 문제를 '전체'나 '틀린 문제'로 바꿔 보세요." : "조건에 맞는 문제가 없어요.");
  }
  ui.session = newSession(mode, ids);
  if (mode === "practice") { const k = ids.findIndex(id => !state.answers[id]); ui.session.i = k >= 0 ? k : 0; }
  ui.screen = "q";
  saveLocal(); render(); window.scrollTo(0, 0);
}

/* ---------- 검토 화면 ---------- */
function renderReview() {
  const s = ui.session;
  const unans = s.ids.filter(id => !arr(s.picks[id]).length).length;
  const flagged = s.ids.filter(id => s.marks[id]).length;
  $("#subbar").innerHTML = `<span class="where"><b>검토 화면</b> · 답한 문항 ${s.ids.length - unans} · 답하지 않은 문항 ${unans}${s.mode === "exam" ? ` · 검토 표시 ${flagged}` : ""}</span>`;
  $("#app").innerHTML = `
    <p class="lead">문항을 누르면 그 문항으로 가요.</p>
    <div class="review">${s.ids.map((id, i) => {
      const p = s.picks[id], c = byId[id];
      let st, cls;
      const pr = s.mode !== "exam" ? state.answers[id] : null;
      if ((s.mode !== "exam" && s.checked[id]) || s.submitted) { st = isRight(c, p) ? "정답" : (arr(p).length ? "오답" : "미답"); cls = isRight(c, p) ? "ok" : "unans"; }
      else if (pr) { st = "지난번 " + (pr.ok ? "정답" : "오답"); cls = pr.ok ? "ok" : "unans"; }
      else if (s.marks[id]) { st = "검토 표시"; cls = "flagged"; }
      else if (!arr(p).length) { st = "미답"; cls = "unans"; }
      else { st = "답함 " + letters(p); cls = ""; }
      return `<button data-jump="${i}"><span>${i + 1}. ${id}</span><span class="st ${cls}">${st}</span></button>`;
    }).join("")}</div>`;
  $("#bottombar").innerHTML = `
    <button class="btn" data-screen="q">◀ 문항으로 돌아가기</button>
    <span class="mid">${s.mode === "exam" && !s.submitted ? `<button class="btn" data-jumpflag ${flagged ? "" : "disabled"}>검토 표시 문항으로</button>` : ""}</span>
    ${s.mode === "exam" ? (s.submitted ? `<button class="btn primary" data-screen="result">성적표</button>` : `<button class="btn primary" data-submit>시험 종료</button>`) : `<button class="btn primary" data-home>연습 끝내기</button>`}`;
}

/* ---------- 성적표 ---------- */
function examScore(s) {
  const list = s.ids.map(id => byId[id]);
  const per = domainStats(list, c => s.picks[c.id] ?? null).map(x => ({ ...x, done: x.total }));
  const ok = list.filter(c => isRight(c, s.picks[c.id])).length;
  return { per, ok, score: scaled(weighted(per) || 0) };
}
function renderResult() {
  const s = ui.session;
  const { per, ok, score } = examScore(s);
  $("#subbar").innerHTML = `<span class="where"><b>성적표</b> · 모의고사</span>`;
  $("#app").innerHTML = `
    <h1 class="title">환산 점수 ${score} / 1000</h1>
    <p class="lead">${score >= 720 ? `<span class="pass-ok">합격선 720을 넘었어요.</span>` : `<span class="pass-no">합격선 720에 ${720 - score}점 모자라요.</span>`} 맞힌 문제 ${ok} / ${s.ids.length} · 영역 비중으로 가중한 점수예요.</p>
    <div class="tbl-wrap"><table>
      <thead><tr><th>영역</th><th class="num">비중</th><th class="num">맞힘</th><th class="num">정답률</th></tr></thead>
      <tbody>${per.map(x => `<tr><td>D${x.d.id} ${esc(x.d.ko)}</td><td class="num">${x.d.weight}%</td><td class="num">${x.ok} / ${x.total}</td><td class="num">${rate(x)}</td></tr>`).join("")}</tbody>
    </table></div>
    <h2>틀린 문항</h2>
    <div class="review">${s.ids.map((id, i) => [id, i]).filter(([id]) => !isRight(byId[id], s.picks[id])).map(([id, i]) => `<button data-jump="${i}"><span>${i + 1}. ${id}</span><span class="st unans">${arr(s.picks[id]).length ? letters(s.picks[id]) + " → " + letters(byId[id].answer) : "미답"}</span></button>`).join("") || `<p class="lead">없어요.</p>`}</div>`;
  $("#bottombar").innerHTML = `<button class="btn" data-screen="review">전체 문항 풀이</button><span class="mid"></span><button class="btn primary" data-home>처음 화면</button>`;
}

function submitExam() {
  const s = ui.session;
  s.submitted = true;
  const patchAns = {}, patchTries = {}, patchWrongs = {};
  s.ids.forEach(id => {
    if (!arr(s.picks[id]).length) return;
    const p = recordAnswer(id, s.picks[id]);
    Object.assign(patchAns, p.answers); Object.assign(patchTries, p.tries); Object.assign(patchWrongs, p.wrongs || {});
  });
  const { ok, score } = examScore(s);
  if (Object.keys(patchAns).length) state.exams.push({ at: new Date().toISOString(), ok, total: s.ids.length, score, secs: Math.round((Date.now() - s.startedAt) / 1000) });
  persist({ answers: patchAns, tries: patchTries, wrongs: patchWrongs, exams: state.exams });
  ui.screen = "result"; render(); window.scrollTo(0, 0);
}

// 탭 두 개: 가이드 단어(DATA.gwords, 가이드 대역본 순서) / 문제 단어(DATA.words, 지문·보기·질문 표현)
const WGROUP = { card: "문제 속 단어", phrase: "시험 질문 표현", guide: "가이드 핵심어" };
const GPARTS = ["1~5장 개요", "5장 시나리오", "도메인 1", "도메인 2", "도메인 3", "도메인 4", "도메인 5", "6~8장 준비", "9장 샘플 문항", "10~18장 시험 안내"];
const isGuideTab = () => ui.vtab !== "exam";
function wordPool() {
  if (isGuideTab()) return DATA.gwords.filter(w => !ui.vpart || ui.vpart === "all" || w.part === ui.vpart);
  return DATA.words.filter(w => !ui.vgroup || ui.vgroup === "all" || (w.group || "card") === ui.vgroup);
}
function wordList() {
  let ws = wordPool();
  if (ui.vfilter === "learn") ws = ws.filter(w => state.words[w.word] !== "known");
  if (ui.vfilter === "known") ws = ws.filter(w => state.words[w.word] === "known");
  if (ui.vsort === "abc") ws.sort((a, b) => a.word.localeCompare(b.word));
  return ws;
}
const wordSub = w => w.part ? `${w.part} · ${w.where}${w.n > 1 ? ` · ${w.n}번 나옴` : ""}` : WGROUP[w.group || "card"];
function exHtml(w, links) {
  return w.examples.slice(0, 2).map(ex => {
    const t = ex.text.replace(/`/g, "");
    const mm = stemRe(w.word).exec(t);
    const body = mm ? esc(t.slice(0, mm.index)) + "<mark>" + esc(mm[0]) + "</mark>" + esc(t.slice(mm.index + mm[0].length)) : esc(t);
    return `<div class="ex">${links && ex.id ? `<button data-card="${ex.id}">${ex.id}</button>` : ""}${body}${ex.ko ? `<span class="exko">${esc(ex.ko)}</span>` : ""}</div>`;
  }).join("");
}

      <label>정렬 <select id="v-sort"><option value="freq" ${ui.vsort === "freq" ? "selected" : ""}>${g ? "가이드 순서" : "빈출순"}</option><option value="abc" ${ui.vsort === "abc" ? "selected" : ""}>ABC순</option></select></label>
    </div>`;
  let body;
  if (!ws.length) body = `<p class="lead">${ui.vfilter === "known" ? "아직 외운 단어가 없어요." : "남은 단어가 없어요."}</p>`;
  else if (ui.vmode === "list") {
    body = `<div class="tbl-wrap"><table>
      <thead><tr><th>외움</th><th>단어</th><th>뜻과 예문</th>${g ? "" : `<th class="num">빈출</th>`}</tr></thead>
      <tbody>${ws.map(w => `<tr>
        <td><input type="checkbox" id="k-${esc(w.word).replace(/\s/g, "_")}" data-know="${esc(w.word)}" ${state.words[w.word] === "known" ? "checked" : ""} aria-label="${esc(w.word)} 외움"></td>
        <td class="word wrap">${esc(w.word)}<small>${esc(w.pos)}</small><span class="wgroup">${esc(wordSub(w))}</span></td>
        <td>${esc(w.ko)}${exHtml(w, true)}${w.tip ? `<div class="tip">${esc(w.tip)}</div>` : ""}</td>
        ${g ? "" : `<td class="num">${w.freq ? w.freq + "회" : "—"}</td>`}</tr>`).join("")}</tbody>
    </table></div>`;
  } else {
    ui.fi = Math.min(ui.fi, ws.length - 1);
    const w = ws[ui.fi];
    body = `<div class="flash">
      <div class="fp">${ui.fi + 1} / ${ws.length} · ${esc(wordSub(w))}${w.freq ? ` · 빈출 ${w.freq}회` : ""}</div>
      <div class="fw">${esc(w.word)}</div><div class="fp">${esc(w.pos)}</div>
      ${ui.flip
        ? `<div class="fk">${esc(w.ko)}</div>${exHtml(w, false)}${w.tip ? `<div class="tip">${esc(w.tip)}</div>` : ""}
           <div class="frow"><button class="btn" data-fnext="learn">아직 헷갈려요</button><button class="btn primary" data-fnext="known">외웠어요 ▶</button></div>`
        : `<button class="btn primary big" data-flip>뜻 보기</button>
           <div class="frow"><button class="btn" data-fnext="learn">아직 헷갈려요</button><button class="btn primary" data-fnext="known">외웠어요 ▶</button></div>
           <p class="fhint">뜻을 안 보고 바로 표시해도 돼요.</p>`}
    </div>`;
  }
  $("#app").innerHTML = tools + body;
  $("#bottombar").innerHTML = ui.vmode === "flash" && ws.length
    ? `<button class="btn" data-fprev>◀ 이전</button><span class="mid"></span><button class="btn" data-fskip>다음 ▶</button>`
    : `<span></span><span class="mid"></span><button class="btn primary" data-home>처음 화면</button>`;
}

/* ---------- 기록 합치기 (DB 에서 받은 기록과 이 기기 기록) ---------- */
// 문제는 나중에 푼 기록, 단어는 나중에 바꾼 표시, 모의고사는 합집합
function mergeInto(d, preferIncomingWords) {
  let na = 0, nw = 0;
  state.wordsAt = state.wordsAt || {};
  Object.entries(d.answers || {}).forEach(([id, rec]) => {
    const cur = state.answers[id];
    if (!cur || (rec.at || "") > (cur.at || "")) { state.answers[id] = rec; na++; }
  });
  const inAt = d.wordsAt || {};
  Object.entries(d.words || {}).forEach(([w, v]) => {
    if (state.words[w] === v) { if ((inAt[w] || "") > (state.wordsAt[w] || "")) state.wordsAt[w] = inAt[w]; return; }
    const a = inAt[w] || "", b = state.wordsAt[w] || "";
    const take = a || b ? a > b : (preferIncomingWords || v === "known");
    if (take) { state.words[w] = v; if (a) state.wordsAt[w] = a; nw++; }
  });
  Object.entries(d.tries || {}).forEach(([id, n]) => { state.tries[id] = Math.max(state.tries[id] || 0, n); });
  state.wrongs = state.wrongs || {}; state.notes = state.notes || {};
  const last = w => (w.fixedAt && w.fixedAt > w.at) ? w.fixedAt : w.at;
  Object.entries(d.wrongs || {}).forEach(([id, w]) => {
    const cur = state.wrongs[id];
    if (!cur) { state.wrongs[id] = w; return; }
    const base = last(w) > last(cur) ? w : cur;
    state.wrongs[id] = { ...base, n: Math.max(cur.n || 0, w.n || 0), first: [cur.first, w.first].filter(Boolean).sort()[0] };
  });
  state.reviews = state.reviews || {};
  Object.entries(d.reviews || {}).forEach(([id, r]) => { const cur = state.reviews[id]; if (!cur || (r.at || "") > (cur.at || "")) state.reviews[id] = r; });
  Object.entries(d.notes || {}).forEach(([id, nt]) => { const cur = state.notes[id]; if (!cur || (nt.at || "") > (cur.at || "")) state.notes[id] = nt; });
  backfillWrongs();
  const seen = new Set(state.exams.map(x => x.at));
  (d.exams || []).forEach(x => { if (!seen.has(x.at)) state.exams.push(x); });
  state.exams.sort((a, b) => a.at < b.at ? -1 : 1);
  saveLocal();
  return { na, nw };
}

/* ---------- 클라우드 저장 (공개 주소용 Supabase, 동기화 암호) ---------- */
const SITE = DATA.site || {};
const CLOUD_OK = !!(SITE.supabaseUrl && SITE.supabaseAnonKey) && !!window.crypto?.subtle;
const SYNC_LS = "ccaf-sync-hash";
let syncHash = null, cloudTimer = null, cloudBusy = false, lastSync = null, cloudErr = "";
try { syncHash = localStorage.getItem(SYNC_LS); } catch (e) {}

async function hashKey(pass) {
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode("ccaf-study:" + pass));
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, "0")).join("");
}
async function rpc(fn, body) {
  const key = SITE.supabaseAnonKey;
  const headers = { apikey: key, "Content-Type": "application/json" };
  if (!key.startsWith("sb_")) headers.Authorization = "Bearer " + key;
  const res = await fetch(SITE.supabaseUrl.replace(/\/$/, "") + "/rest/v1/rpc/" + fn, { method: "POST", headers, body: JSON.stringify(body) });
  if (!res.ok) throw new Error(res.status + " " + (await res.text()).slice(0, 120));
  const text = await res.text();
  return text ? JSON.parse(text) : null;
}
async function cloudSync(quiet) {
  if (!CLOUD_OK || !syncHash || cloudBusy) return null;
  cloudBusy = true;
  try {
    const remote = await rpc("load_progress", { p_hash: syncHash });
    const r = remote ? mergeInto(remote) : { na: 0, nw: 0 };
    await rpc("save_progress", { p_hash: syncHash, p_data: state });
    lastSync = new Date(); cloudErr = "";
    return r;
  } catch (e) {
    cloudErr = "DB 에 연결하지 못했어요. 이 기기에만 저장 중이에요.";
    if (!quiet) toast(cloudErr);
    return null;
  } finally {
    cloudBusy = false;
    const box = $("#sync-status"); if (box) box.textContent = syncStatusText();
    updatePill();
    // 연결 실패·복구로 처음 화면의 DB 칸이 나타나거나 사라져야 하면 다시 그린다
    if (ui.screen === "home" && !!$("#sync-box") !== (!syncHash || !!cloudErr) && !document.activeElement?.matches("textarea, input")) render();
  }
}
function updatePill() {
  const el = $("#sync-pill");
  if (!el) return;
  if (!CLOUD_OK) { el.hidden = true; return; }
  el.hidden = false;
  el.textContent = !syncHash ? "DB 저장 꺼짐" : cloudErr ? "저장 연결 실패" : lastSync ? `동기화 ${String(lastSync.getHours()).padStart(2, "0")}:${String(lastSync.getMinutes()).padStart(2, "0")}` : "동기화 중…";
}
function scheduleCloud() {
  if (!CLOUD_OK || !syncHash) return;
  clearTimeout(cloudTimer);
  cloudTimer = setTimeout(() => cloudSync(true), 1500);
}
function syncStatusText() {
  if (cloudErr) return cloudErr;
  if (!lastSync) return "DB 에 저장 중…";
  return `DB 에 자동 저장 중 · 마지막 저장 ${String(lastSync.getHours()).padStart(2, "0")}:${String(lastSync.getMinutes()).padStart(2, "0")}`;
}
function syncBoxHtml() {
  if (!CLOUD_OK) return `<p>지금은 이 브라우저에만 저장돼요.</p>`;
  if (syncHash) return `<p id="sync-status">${syncStatusText()}</p>
    <div class="row"><button class="btn primary" data-sync-now>다시 시도</button><button class="btn" data-sync-off>이 기기 연결 끊기</button></div>`;
  return `<p>이 기기는 아직 DB 에 연결되지 않아 이 브라우저에만 저장돼요. 다른 기기에서 쓰던 <b>동기화 암호</b>를 한 번 넣으면 DB 에 저장되고 기록이 이어져요.</p>
    <label for="sync-pass" class="lead" style="margin:0">동기화 암호 (8자 이상)</label>
    <div class="row"><input id="sync-pass" type="password" autocomplete="off" style="flex:1 1 0;min-width:0;border:1px solid #9AA3AF;padding:5px 8px"><button class="btn primary" data-sync-on>연결</button></div>`;
}

/* ---------- 공통 ---------- */
function render() {
  const s = ui.session;
  if (["q", "review", "result"].includes(ui.screen) && !s) ui.screen = "home";
  $("#subbar").hidden = ui.screen === "home";
  $("#bottombar").hidden = ui.screen === "home";
  $("#bottombar").classList.toggle("stack", ui.screen === "study");
  $("#home-btn").hidden = ui.screen === "home";
  $("#meta").textContent = s && ["q", "review", "result"].includes(ui.screen) ? ({ exam: "모의고사", practice: "연습 모드", single: "문항 보기" }[s.mode]) : "";
  $("#pop").hidden = true;
  if (ui.screen === "home") renderHome();
  else if (ui.screen === "q") renderQuestion();
  else if (ui.screen === "review") renderReview();
  else if (ui.screen === "result") renderResult();
  else if (ui.screen === "study") renderStudy();
  else if (ui.screen === "note") renderNote();
  else if (ui.screen === "ai") renderAi();
  else renderWords();
  tick();
}

function tick() {
  const s = ui.session, t = $("#timer");
  if (!s || s.mode !== "exam" || s.submitted || !["q", "review"].includes(ui.screen)) { t.hidden = true; return; }
  const left = Math.max(0, Math.round((s.endsAt - Date.now()) / 1000));
  t.hidden = false;
  t.textContent = `남은 시간 ${Math.floor(left / 3600)}:${String(Math.floor(left / 60) % 60).padStart(2, "0")}:${String(left % 60).padStart(2, "0")}`;
  t.classList.toggle("low", left < 600);
  if (left === 0) { toast("시간이 끝나 자동으로 제출했어요"); submitExam(); }
}
setInterval(tick, 1000);

function showWord(key) {
  const w = wordMap[key];
  if (!w) return;
  const known = state.words[key] === "known";
  const pop = $("#pop");
  pop.innerHTML = `<div class="pw">${esc(w.word)}<small>${esc(w.pos)} · 전체 지문 ${w.freq}회</small></div><div class="st ${known ? "known" : "learn"}">${known ? "외운 단어" : "외울 단어"}</div><div>${esc(w.ko)}</div>
    <div class="row"><button class="btn" data-know="${esc(key)}">${known ? "외울 단어로 되돌리기" : "외웠어요"}</button><button class="btn" data-close>닫기</button></div>`;
  pop.hidden = false;
}
function setKnown(key, on) {
  const next = (on ?? state.words[key] !== "known") ? "known" : "learn";
  state.words[key] = next;
  state.wordsAt = Object.assign(state.wordsAt || {}, { [key]: new Date().toISOString() });
  persist({ words: { [key]: next }, wordsAt: { [key]: state.wordsAt[key] } });
}
function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.hidden = false;
  clearTimeout(toast.t); toast.t = setTimeout(() => { t.hidden = true; }, 2600);
}
function go(screen) { ui.screen = screen; saveLocal(); render(); window.scrollTo(0, 0); }

// 단일 문항 보기(단어장·공부 자료에서 열기) 전에 하던 세션과 화면을 기억한다
let parked = null;
function openSingle(id) {
  if (!ui.session || ui.session.mode !== "single") parked = { session: ui.session, screen: ui.screen };
  ui.session = newSession("single", [id]);
  go("q");
}

document.addEventListener("click", e => {
  const el = e.target.closest("button");
  if (!el) { if (!e.target.closest("#pop, input, label")) $("#pop").hidden = true; return; }
  const d = el.dataset, s = ui.session;
  if ("home" in d) { if (s && (s.submitted || s.mode === "single")) ui.session = parked?.session || (s.submitted ? null : s); parked = null; return go("home"); }
  if ("back" in d) { ui.session = parked?.session || null; const scr = parked?.screen || "home"; parked = null; return go(scr); }
  if (d.start) return start(d.start);
  if ("syncOn" in d) {
    const pass = $("#sync-pass").value;
    if (pass.length < 8) return toast("동기화 암호는 8자 이상으로 정해 주세요");
    hashKey(pass).then(async h => {
      syncHash = h;
      try { localStorage.setItem(SYNC_LS, h); } catch (e) {}
      const r = await cloudSync();
      if (r) toast(`DB 에 연결했어요. DB 에서 푼 문제 ${r.na}개, 단어 ${r.nw}개를 합쳤어요`);
      render();
    });
    return;
  }
  if ("syncNow" in d && !syncHash) {
    if (ui.screen !== "home") return toast("처음 화면의 '기록 저장 (DB)' 칸에 동기화 암호를 넣으면 DB 에 저장돼요");
    const box = $("#sync-box"); if (box) { box.scrollIntoView({ block: "center" }); $("#sync-pass")?.focus(); }
    return;
  }
  if ("syncNow" in d) { cloudSync().then(r => { if (r) { toast(`동기화했어요. 새로 들어온 푼 문제 ${r.na}개, 단어 ${r.nw}개`); render(); } }); return; }
  if ("syncOff" in d) {
    if (!confirm("이 기기의 DB 연결만 끊어요. DB 와 이 기기의 기록은 그대로 남아요. 끊을까요?")) return;
    syncHash = null; lastSync = null; cloudErr = "";
    try { localStorage.removeItem(SYNC_LS); } catch (e) {}
    updatePill();
    return render();
  }
  if ("drill" in d) { ui.vmode = "flash"; ui.vfilter = "learn"; ui.vtab = d.drill === "exam" ? "exam" : "guide"; ui.vgroup = "all"; ui.vpart = "all"; ui.vsort = "freq"; ui.fi = 0; ui.flip = false; return go("words"); }
  if (d.screen === "words" && el.closest(".mode")) { ui.vmode = "list"; ui.vfilter = "all"; ui.vgroup = "all"; ui.vpart = "all"; }
  if (d.vtab) { ui.vtab = d.vtab; ui.fi = 0; ui.flip = false; saveLocal(); return render(); }
  if ("resume" in d) return go("q");
  if (d.study) { ui.study = Math.max(1, Math.min(6, +d.study)); return go("study"); }
  if (d.scenarioPractice) { ui.scen = d.scenarioPractice; ui.domain = "all"; ui.filter = "all"; return start("practice"); }
  if (d.screen) return go(d.screen);
  if (d.move) { s.i = Math.max(0, Math.min(s.ids.length - 1, s.i + +d.move)); return go("q"); }
  if (d.jump) { s.i = +d.jump; return go("q"); }
  if ("jumpflag" in d) { const i = s.ids.findIndex(id => s.marks[id]); if (i >= 0) { s.i = i; go("q"); } return; }
  if ("flag" in d) { const id = s.ids[s.i]; s.marks[id] = !s.marks[id]; saveLocal(); return render(); }
  if ("submit" in d) {
    const unans = s.ids.filter(id => !arr(s.picks[id]).length).length;
    if (!confirm(unans ? `답하지 않은 문항이 ${unans}개 있어요. 시험을 종료할까요?` : "시험을 종료하고 채점할까요?")) return;
    return submitExam();
  }
  if ("check" in d) {
    const id = s.ids[s.i], c = byId[id], pick = s.picks[id];
    if (!complete(c, pick)) return;
    s.checked[id] = true;
    persist(recordAnswer(id, pick));
    return render();
  }
  if (d.afilter) { ui.afilter = d.afilter; saveLocal(); return render(); }
  if ("aistart" in d) {
    const ids = cards.filter(c => c.ai && !reviewOf(c.id)).filter(c => !ui.ascen || ui.ascen === "all" || String(c.sc) === String(ui.ascen)).map(c => c.id);
    if (!ids.length) return;
    ui.session = newSession("practice", ids); return go("q");
  }
  if (d.review) {
    state.reviews = state.reviews || {};
    const prevR = state.reviews[d.rid];
    state.reviews[d.rid] = { v: d.review, reason: d.review === "bad" ? (prevR?.reason || "") : "", at: new Date().toISOString() };
    persist({ reviews: { [d.rid]: state.reviews[d.rid] } });
    toast(d.review === "ok" ? "괜찮아요로 표시했어요. 일반 연습·모의고사에 들어가요" : "이상해요로 표시했어요. 이유를 적어 주면 고칠 때 참고할게요");
    render();
    if (d.review === "bad") $("#review-" + d.rid)?.focus();
    return;
  }
  if (d.nfilter) { ui.nfilter = d.nfilter; saveLocal(); return render(); }
  if (d.noteretry) return openSingle(d.noteretry);
  if (d.noteview) { openSingle(d.noteview); const ss = ui.session, pr = state.answers[d.noteview]; if (pr) { ss.picks[d.noteview] = pr.pick; ss.checked[d.noteview] = true; saveLocal(); render(); } return; }
  if ("noteall" in d) {
    const ids = Object.keys(state.wrongs).filter(id => byId[id] && isUnfixed(id)).sort((a, b) => cards.indexOf(byId[a]) - cards.indexOf(byId[b]));
    if (!ids.length) return;
    ui.session = newSession("practice", ids); return go("q");
  }
  if ("showprev" in d) { const id = s.ids[s.i], pr = state.answers[id]; if (pr) { s.picks[id] = pr.pick; s.checked[id] = true; saveLocal(); render(); } return; }
  if ("retry" in d) { const id = s.ids[s.i]; delete s.checked[id]; delete s.picks[id]; saveLocal(); return render(); }
  if ("copy" in d) {
    const ta = $("#discuss-text");
    const fallback = () => { ta.select(); toast("글자를 선택해 두었어요. 복사해서 붙여 넣으세요"); };
    if (navigator.clipboard?.writeText) navigator.clipboard.writeText(ta.value).then(() => toast("복사했어요. Claude Code 채팅에 붙여 넣으세요"), fallback);
    else fallback();
    return;
  }
  if (d.know) { setKnown(d.know); render(); showWord(d.know); return; }
  if ("close" in d) { $("#pop").hidden = true; return; }
  if (d.word) return showWord(d.word);
  if (d.card) return openSingle(d.card);
  if ("flip" in d) { ui.flip = true; return render(); }
  if ("fprev" in d) { ui.fi = Math.max(0, ui.fi - 1); ui.flip = false; return render(); }
  if ("fskip" in d) { const n = wordList().length; ui.fi = n ? (ui.fi + 1) % n : 0; ui.flip = false; return render(); }
  if (d.fnext) {
    const ws = wordList(), w = ws[ui.fi];
    if (w) setKnown(w.word, d.fnext === "known");
    const after = wordList();
    ui.fi = after.length === ws.length ? (ui.fi + 1) % Math.max(1, after.length) : (after.length ? ui.fi % after.length : 0);
    ui.flip = false; saveLocal(); return render();
  }
});

document.addEventListener("change", e => {
  const t = e.target, s = ui.session;
  if (t.name === "opt") {
    const c = byId[s.ids[s.i]], i = +t.value;
    if (need(c) > 1) {
      let cur = arr(s.picks[c.id]);
      cur = t.checked ? [...cur, i] : cur.filter(x => x !== i);
      if (cur.length > need(c)) { toast(`${need(c)}개까지만 고를 수 있어요`); cur = cur.filter(x => x !== i); }
      s.picks[c.id] = cur.sort((a, b) => a - b);
    } else s.picks[c.id] = i;
    saveLocal(); return render();
  }
  if (t.id === "t-ko") { ui.ko = t.checked; saveLocal(); return render(); }
  if (t.id === "t-words") { ui.wordsOn = t.checked; saveLocal(); return render(); }
  if (t.id === "f-filter") { ui.filter = t.value; return saveLocal(); }
  if (t.id === "f-domain") { ui.domain = t.value; return saveLocal(); }
  if (t.id === "f-scen") { ui.scen = t.value; return saveLocal(); }
  if (t.id === "a-scen") { ui.ascen = t.value; saveLocal(); return render(); }
  if (t.id === "n-scen") { ui.nscen = t.value; saveLocal(); return render(); }
  if (t.id === "s-pick") { ui.study = +t.value; return go("study"); }
  if (t.id === "v-mode") { ui.vmode = t.value; ui.fi = 0; ui.flip = false; saveLocal(); return render(); }
  if (t.id === "v-part") { ui.vpart = t.value; ui.fi = 0; ui.flip = false; saveLocal(); return render(); }
  if (t.id === "v-group") { ui.vgroup = t.value; ui.fi = 0; ui.flip = false; saveLocal(); return render(); }
  if (t.id === "v-filter") { ui.vfilter = t.value; ui.fi = 0; ui.flip = false; saveLocal(); return render(); }
  if (t.id === "v-sort") { ui.vsort = t.value; saveLocal(); return render(); }
  if (t.dataset.know) { setKnown(t.dataset.know, t.checked); return render(); }
});

let memoTimer = {};
document.addEventListener("input", e => {
  const rid = e.target.dataset?.reviewnote;
  if (rid) {
    clearTimeout(memoTimer["r" + rid]);
    memoTimer["r" + rid] = setTimeout(() => {
      state.reviews[rid] = { ...(state.reviews[rid] || { v: "bad" }), reason: e.target.value, at: new Date().toISOString() };
      persist({ reviews: { [rid]: state.reviews[rid] } });
      const st = $("#review-state-" + rid); if (st) st.textContent = "저장됨";
    }, 700);
    return;
  }
  const id = e.target.dataset?.memo;
  if (!id) return;
  const st = $("#memo-state-" + id); if (st) st.textContent = "저장 중…";
  clearTimeout(memoTimer[id]);
  memoTimer[id] = setTimeout(() => {
    state.notes[id] = { text: e.target.value, at: new Date().toISOString() };
    persist({ notes: { [id]: state.notes[id] } });
    const st2 = $("#memo-state-" + id); if (st2) st2.textContent = "저장됨";
  }, 700);
});
document.addEventListener("toggle", e => {
  if (e.target.classList?.contains("scbox")) { ui.scOpen = e.target.open; saveLocal(); }
}, true);

document.addEventListener("keydown", e => {
  if (e.target.matches("textarea, select") || ui.screen !== "q") return;
  const s = ui.session, c = byId[s.ids[s.i]];
  const locked = s.mode === "exam" ? s.submitted : s.checked[c.id];
  const k = e.key.toLowerCase();
  const idx = /^[1-5]$/.test(k) ? +k - 1 : "abcde".indexOf(k);
  if (idx >= 0 && idx < c.options.length && !locked && k.length === 1) {
    const box = document.querySelectorAll('input[name="opt"]')[idx];
    if (box) { box.checked = need(c) > 1 ? !box.checked : true; box.dispatchEvent(new Event("change", { bubbles: true })); }
  }
  else if (e.key === "ArrowRight" && s.i < s.ids.length - 1) { s.i++; go("q"); }
  else if (e.key === "ArrowLeft" && s.i > 0) { s.i--; go("q"); }
  else if (e.key === "Escape") $("#pop").hidden = true;
});

render();

updatePill();
if (CLOUD_OK && syncHash) {
  cloudSync(true).then(r => { if (r && (r.na || r.nw) && $("#pop").hidden && !document.activeElement?.matches("textarea, input")) render(); });
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible") cloudSync(true).then(r => { if (r && (r.na || r.nw) && $("#pop").hidden && !document.activeElement?.matches("textarea, input")) render(); });
  });
}

</script>
